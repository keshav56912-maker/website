<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>User Management</h1>

        <form id="userForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="text"
                id="phone"
                placeholder="Phone"
                required
            >

            <button type="submit" id="submitBtn">
                Add User
            </button>

        </form>

        <h2>Users</h2>

        <ul id="userList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
